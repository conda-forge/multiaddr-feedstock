{% set name = "multiaddr" %}
{% set version = "0.3.1" %}


package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/{{ name[0] }}/{{ name }}/{{ name }}-{{ version }}.tar.gz
  sha256: 3efc9cac0d2859fd51b9827a75874bfa7e413d328617ef12ede3a0015ef8764e

build:
  number: 0
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv

requirements:
  host:
    - pip
    - setuptools
    - pytest-runner
    - python {{ python_min }}
  run:
    - python >={{ python_min }}
    - base58
    - dnspython >=2.7.0
    - idna
    - netaddr
    - psutil
    - py-cid >=0.6.0
    - py-multicodec >=1.1.0
    - py-multibase >=2.1.0
    - pymultihash >=4.0.0
    - trio-typing >=0.0.4
    - trio >=0.26.0
    - varint

test:
  imports:
    - multiaddr
    - multiaddr.codecs
  requires:
    - pip
    - python {{ python_min }}

about:
  home: https://github.com/multiformats/py-multiaddr
  summary: Python implementation of jbenet's multiaddr
  doc_url: https://pythonhosted.org/multiaddr/
  license: MIT
  license_file: LICENSE-MIT

extra:
  recipe-maintainers:
    - step21
